name: EAS Update

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/eas-update.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # OTA bundles don't get eas.json build env, so every EXPO_PUBLIC_* value must be set here.
      - name: Publish OTA update (preview)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://tingting-api-production.up.railway.app
          EXPO_PUBLIC_APP_KEY: ${{ secrets.APP_KEY }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'manual update' }}
        run: eas update --branch preview --non-interactive --message "$COMMIT_MESSAGE"

      - name: Publish OTA update (production)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://tingting-api-production.up.railway.app
          EXPO_PUBLIC_APP_KEY: ${{ secrets.APP_KEY }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'manual update' }}
        run: eas update --branch production --non-interactive --message "$COMMIT_MESSAGE"
